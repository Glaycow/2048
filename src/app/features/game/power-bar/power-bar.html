<div class="bar" role="toolbar" aria-label="Poderes">
  @for (id of ids; track id) {
    <button
      type="button"
      class="power"
      [class.active]="active() === id"
      [disabled]="!available()[id]"
      [attr.aria-pressed]="id === 'remove' || id === 'swap' ? active() === id : null"
      [attr.aria-keyshortcuts]="info[id].key"
      [title]="info[id].hint + ' (' + info[id].key + ')'"
      (click)="use.emit(id)"
    >
      <svg class="icon" viewBox="0 0 24 24" aria-hidden="true">
        @switch (id) {
          @case ('undo') {
            <path d="M9 14 4 9l5-5" />
            <path d="M4 9h10.5a5.5 5.5 0 0 1 0 11H11" />
          }
          @case ('swap') {
            <path d="m16 3 4 4-4 4" />
            <path d="M20 7H4" />
            <path d="m8 21-4-4 4-4" />
            <path d="M4 17h16" />
          }
          @case ('remove') {
            <path d="M3 6h18" />
            <path d="M8 6V4h8v2" />
            <path d="m19 6-1 14H6L5 6" />
            <path d="M10 11v5M14 11v5" />
          }
          @case ('shuffle') {
            <path d="M2 18h3.5a4 4 0 0 0 3.3-1.7l6.4-8.6A4 4 0 0 1 18.5 6H22" />
            <path d="m18 2 4 4-4 4" />
            <path d="M2 6h3.5a4 4 0 0 1 3.3 1.7l.7 1" />
            <path d="M22 18h-3.5a4 4 0 0 1-3.3-1.7l-.7-1" />
            <path d="m18 14 4 4-4 4" />
          }
        }
      </svg>
      <span class="name">{{ info[id].name }}</span>
      <span class="charges" [attr.aria-label]="powers()[id] + ' cargas'">
        @for (slot of slots; track slot) {
          <i [class.on]="slot < powers()[id]"></i>
        }
      </span>
    </button>
  }
</div>
@if (recharges()) {
  <p class="recharge">+1 carga em cada poder em <strong>{{ nextRecharge() }}</strong> movimentos</p>
}
