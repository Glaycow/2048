<div class="face" aria-hidden="true">
  @switch (kind()) {
    @case ('multiplier') {
      <span class="mult">×2</span>
    }
    @case ('stone') {
      <svg class="icon" viewBox="0 0 32 32">
        <path d="M5 21 9 9l9-4 9 6 1 11-9 6H11z" fill="currentColor" />
        <path d="m9 9 6 7 3-11M15 16l-4 12m4-12 13 6" fill="none" stroke="var(--crack)" stroke-width="1.4" />
      </svg>
    }
    @default {
      @if (tile().frozen; as frozen) {
        <span class="frost"></span>
        <span class="num">{{ tile().value }}</span>
        <span class="badge ice">{{ frozen }}</span>
      } @else {
        {{ tile().value }}
      }
    }
  }
</div>
