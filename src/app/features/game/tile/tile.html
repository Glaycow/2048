<div class="face" aria-hidden="true">
  @switch (kind()) {
    @case ('bomb') {
      <svg class="icon" viewBox="0 0 32 32">
        <circle cx="14" cy="18" r="10" fill="currentColor" />
        <rect x="18" y="5" width="6" height="6" rx="1.5" transform="rotate(45 21 8)" fill="currentColor" />
        <path d="M23 6c2-3 5-3 6-1" fill="none" stroke="var(--spark)" stroke-width="2" stroke-linecap="round" />
        <circle cx="10" cy="14" r="2.5" fill="#fff" opacity=".35" />
      </svg>
      <span class="badge">{{ tile().fuse }}</span>
    }
    @case ('multiplier') {
      <span class="mult">×2</span>
    }
    @case ('stone') {
      <svg class="icon" viewBox="0 0 32 32">
        <path d="M5 21 9 9l9-4 9 6 1 11-9 6H11z" fill="currentColor" />
        <path d="m9 9 6 7 3-11M15 16l-4 12m4-12 13 6" fill="none" stroke="var(--crack)" stroke-width="1.4" />
      </svg>
    }
    @default {
      @if (tile().frozen; as frozen) {
        <span class="frost"></span>
        <span class="num">{{ tile().value }}</span>
        <span class="badge ice">{{ frozen }}</span>
      } @else {
        {{ tile().value }}
      }
    }
  }
</div>
