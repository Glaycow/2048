<div class="frame" (appSwipe)="swipe.emit($event)">
  <div class="area">
    <div class="cells" aria-hidden="true">
      @for (cell of cells(); track cell) {
        <div class="cell" [class.blocked]="blocked().has(cell)"></div>
      }
    </div>
    @for (tile of tiles(); track tile.id) {
      <app-tile
        [tile]="tile"
        [ghost]="ghostIds().has(tile.id)"
        [class.selected]="tile.id === selectedId()"
        (click)="pick(tile)"
      />
    }
    <ng-content />
  </div>
</div>
