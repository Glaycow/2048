<main class="menu">
  <header>
    <h1 class="logo">2048</h1>
    <p class="tagline">Escolha como quer jogar.</p>
  </header>

  @if (store.hasProgress()) {
    <button type="button" class="continue" (click)="continueGame()">
      <span>
        <strong>Continuar partida</strong>
        <small>{{ store.modeInfo().name }} · {{ store.score() }} pontos</small>
      </span>
      <span aria-hidden="true">›</span>
    </button>
  }

  <ul class="modes">
    @for (mode of modes; track mode.id) {
      <li>
        <button type="button" class="card" [attr.data-mode]="mode.id" (click)="choose(mode.id)">
          <span class="icon" aria-hidden="true">
            <svg viewBox="0 0 24 24">
              @switch (mode.id) {
                @case ('classic') {
                  <rect x="3" y="3" width="8" height="8" rx="2" />
                  <rect x="13" y="3" width="8" height="8" rx="2" />
                  <rect x="3" y="13" width="8" height="8" rx="2" />
                  <rect x="13" y="13" width="8" height="8" rx="2" />
                }
                @case ('timed') {
                  <circle cx="12" cy="13" r="8" />
                  <path d="M12 9v4l2.5 2.5M9 2h6" />
                }
                @case ('daily') {
                  <rect x="3" y="5" width="18" height="16" rx="2" />
                  <path d="M3 10h18M8 3v4M16 3v4" />
                  <path d="m9 15 2 2 4-4" />
                }
                @case ('puzzle') {
                  <path d="M10 3h4v3a2 2 0 1 0 4 0h3v5h-3a2 2 0 1 0 0 4h3v6h-6v-3a2 2 0 1 0-4 0v3H4v-6h3a2 2 0 1 0 0-4H4V3h6z" />
                }
                @case ('zen') {
                  <path d="M12 21c-5 0-9-3-9-7 3 0 6 1 9 4 3-3 6-4 9-4 0 4-4 7-9 7z" />
                  <path d="M12 18c-2-3-2-8 0-13 2 5 2 10 0 13z" />
                }
              }
            </svg>
          </span>
          <span class="text">
            <strong>{{ mode.name }}</strong>
            <span>{{ mode.description }}</span>
            <small>{{ details()[mode.id] }}</small>
          </span>
        </button>
      </li>
    }
  </ul>
</main>
